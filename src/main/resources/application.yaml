spring:
  application:
    name: ms-customer
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  mongodb:
    uri: mongodb://mscustomer:mscustomer123@localhost:27017/customerdb?authSource=admin

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
