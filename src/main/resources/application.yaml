spring:
  application:
    name: ms-customer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:classpath:mongo-credentials.yaml

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  issuer: ms-customer
  expiration: PT1H
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:secrets/jwt-private-key.pem}
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:secrets/jwt-public-key.pem}
